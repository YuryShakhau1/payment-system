apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-system-redis-pvc
  namespace: payment-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "800Mi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.8-alpine

          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "800Mi"
              cpu: "1"

          ports:
            - containerPort: 6379

          command:
            - redis-server
            - --requirepass
            - $(REDIS_SECRET_PASSWORD)

          env:
            - name: REDIS_SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: REDIS_SECRET_PASSWORD

          volumeMounts:
            - name: redis-data
              mountPath: /data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_SECRET_PASSWORD" ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_SECRET_PASSWORD" ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: payment-system-redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payment-system
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379