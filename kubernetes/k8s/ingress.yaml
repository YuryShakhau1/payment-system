apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: payment-system-ingress
  namespace: payment-system
spec:
  ingressClassName: nginx

  rules:
    - host: api.payment-system.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8100

    - host: payment-system.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-system-ui
                port:
                  number: 3000
