apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: payment-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/yuryshakhau1/payment-system/api-gateway:1.0.0

          envFrom:
            - secretRef:
                name: payment-system-secrets

          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          ports:
            - containerPort: 8100

          env:
            - name: API_GATE_WAY_SERVICE_PORT
              value: "8100"
              
            - name: AUTH_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: AUTH_SERVICE_URL

            - name: USER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: USER_SERVICE_URL

            - name: PRODUCT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRODUCT_SERVICE_URL

            - name: ORDER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: ORDER_SERVICE_URL

            - name: PAYMENT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PAYMENT_SERVICE_URL

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8100
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8100
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payment-system
spec:
  type: ClusterIP

  selector:
    app: api-gateway

  ports:
    - port: 8100
      targetPort: 8100