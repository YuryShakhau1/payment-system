apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-system-product-service
  namespace: payment-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-system-product-service

  template:
    metadata:
      labels:
        app: payment-system-product-service

    spec:
      containers:
        - name: product-service
          image: ghcr.io/yuryshakhau1/payment-system/product-service:1.0.0

          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          ports:
            - containerPort: 8082

          env:
            - name: PRODUCT_SERVICE_PORT
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRODUCT_SERVICE_PORT

            - name: PRODUCT_SERVICE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRODUCT_SERVICE_DB_HOST

            - name: PRODUCT_SERVICE_DB_PORT
              value: "5432"

            - name: PRODUCT_SERVICE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRODUCT_SERVICE_DB_NAME

            - name: PRODUCT_SERVICE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRODUCT_SERVICE_DB_USERNAME

            - name: PRODUCT_SERVICE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRODUCT_SERVICE_DB_PASSWORD

            - name: SPRING_CONFIG_IMPORT
              value: ""

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: payment-system-product-service
  namespace: payment-system
spec:
  type: ClusterIP

  selector:
    app: payment-system-product-service

  ports:
    - port: 8082
      targetPort: 8082