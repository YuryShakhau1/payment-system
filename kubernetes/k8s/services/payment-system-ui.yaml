apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-system-ui
  namespace: payment-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-system-ui

  template:
    metadata:
      labels:
        app: payment-system-ui

    spec:
      containers:
        - name: payment-system-ui
          image: ghcr.io/yuryshakhau1/payment-system-ui:1.0.0

          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "300Mi"
              cpu: "300m"

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: VITE_BACKEND_API_URL
              value: http://api.payment-system.local

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: payment-system-ui
  namespace: payment-system
spec:
  type: ClusterIP

  selector:
    app: payment-system-ui

  ports:
    - port: 3000
      targetPort: 80
