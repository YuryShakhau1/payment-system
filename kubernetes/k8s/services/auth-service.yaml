apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-auth-service
  namespace: payment-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: core-auth-service

  template:
    metadata:
      labels:
        app: core-auth-service

    spec:
      containers:
        - name: core-auth-service
          image: ghcr.io/yuryshakhau1/payment-system/core-auth-service:1.0.0

          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          ports:
            - containerPort: 8081

          env:
            - name: AUTH_SERVICE_PORT
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: AUTH_SERVICE_PORT

            - name: AUTH_SERVICE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: AUTH_SERVICE_DB_HOST

            - name: AUTH_SERVICE_DB_PORT
              value: "5432"

            - name: AUTH_SERVICE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: AUTH_SERVICE_DB_NAME

            - name: AUTH_SERVICE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: AUTH_SERVICE_DB_USERNAME

            - name: AUTH_SERVICE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: AUTH_SERVICE_DB_PASSWORD

            - name: KAFKA_HOST_PORT
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: KAFKA_HOST_PORT

            - name: CARD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: CARD_SECRET_KEY

            - name: REDIS_SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: REDIS_SECRET_PASSWORD

            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: PRIVATE_KEY

            - name: JWT_IS_PROD
              value: "true"

            - name: JWT_ACCESS_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: JWT_ACCESS_EXPIRATION

            - name: JWT_PRIVATE_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: JWT_PRIVATE_EXPIRATION

            - name: SPRING_CONFIG_IMPORT
              value: ""

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: core-auth-service
  namespace: payment-system
spec:
  type: ClusterIP

  selector:
    app: core-auth-service

  ports:
    - port: 8081
      targetPort: 8081