apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-user-service
  namespace: payment-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: core-user-service

  template:
    metadata:
      labels:
        app: core-user-service

    spec:
      containers:
        - name: core-user-service
          image: ghcr.io/yuryshakhau1/payment-system/core-user-service:1.0.0

          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          ports:
            - name: http
              containerPort: 8084
              protocol: TCP

          env:
            - name: USER_SERVICE_PORT
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: USER_SERVICE_PORT

            - name: USER_SERVICE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: USER_SERVICE_DB_HOST

            - name: USER_SERVICE_DB_PORT
              value: "5432"

            - name: USER_SERVICE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: USER_SERVICE_DB_NAME

            - name: USER_SERVICE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: USER_SERVICE_DB_USERNAME

            - name: USER_SERVICE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: USER_SERVICE_DB_PASSWORD

            - name: KAFKA_HOST_PORT
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: KAFKA_HOST_PORT

            - name: CARD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: CARD_SECRET_KEY

            - name: REDIS_SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: REDIS_SECRET_PASSWORD

            - name: ADMIN_INIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: ADMIN_INIT_SECRET

            - name: SPRING_CONFIG_IMPORT
              value: ""

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: core-user-service
  namespace: payment-system
spec:
  type: ClusterIP

  selector:
    app: core-user-service

  ports:
    - port: 8080
      targetPort: 8080