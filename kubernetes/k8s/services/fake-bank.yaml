apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-bank
  namespace: payment-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: fake-bank

  template:
    metadata:
      labels:
        app: fake-bank

    spec:
      containers:
        - name: fake-bank
          image: ghcr.io/yuryshakhau1/payment-system/fake-bank:1.0.0

          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          ports:
            - containerPort: 8085

          env:
            - name: EXTERNAL_BANK_HOST
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: EXTERNAL_BANK_HOST

            - name: EXTERNAL_BANK_PORT
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: EXTERNAL_BANK_PORT

            - name: SPRING_CONFIG_IMPORT
              value: ""

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: fake-bank
  namespace: payment-system
spec:
  type: ClusterIP

  selector:
    app: fake-bank

  ports:
    - port: 8085
      targetPort: 8085