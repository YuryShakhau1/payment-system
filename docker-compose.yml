services:
  user-service-db:
    image: postgres:18-alpine
    container_name: user_service_postgres
    profiles:
      - infr
      - core
      - no-payment
      - backend
      - full
    command: >
      postgres 
      -c shared_buffers=32MB 
      -c max_connections=20 
      -c work_mem=2MB 
      -c maintenance_work_mem=8MB 
      -c max_worker_processes=2 
      -c max_parallel_workers=2
    environment:
      - POSTGRES_DB=${USER_SERVICE_DB_NAME}
      - POSTGRES_USER=${USER_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD=${USER_SERVICE_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${USER_SERVICE_DB_PORT}:5432"
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M
          cpus: '0.30'
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


  auth-service-db:
    image: postgres:18-alpine
    container_name: auth_service_postgres
    profiles:
      - infr
