  redis:
    image: redis:8.8-alpine
    container_name: redis
    profiles:
      - infr
      - core
      - no-payment
      - backend
      - full
    command: >
      redis-server 
      --requirepass ${REDIS_SECRET_PASSWORD}
      --maxmemory 32mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SECRET_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          memory: 100M
        limits:
          memory: 300M
          cpus: '0.20'
    volumes:
      - payment_system_redis_data:/data
    restart: always


  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    profiles:
      - infr
      - core
      - no-payment
      - backend
      - full
    volumes:
      - payment_system_kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
      - "29093:29093"
      - "29094:29094"
    environment:
      - KAFKA_HEAP_OPTS=-Xmx384m -Xms256m
      - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:29094,CONTROLLER://0.0.0.0:29093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:29094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=4
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 800M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 29092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s


  payment-service-payment-mongodb:
    image: mongo:8.0
    container_name: payment_service_mongodb
    profiles:
      - infr
      - core
      - backend
      - full
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "${PAYMENT_SERVICE_MONGO_DB_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${PAYMENT_SERVICE_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_SERVICE_MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_SERVICE_MONGO_DB_PASSWORD}
    volumes:
      - payment_service_payment_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongod", "--help"]
      interval: 5s
      timeout: 5s
      retries: 5


  core-user-service:
    image: ghcr.io/yuryshakhau1/payment-system/core-user-service:1.0.0
    container_name: core_user_service
    profiles:
      - core
      - no-payment
      - backend
      - full
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=40.0 -XX:+UseG1GC
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - USER_SERVICE_DB_HOST=${USER_SERVICE_DB_HOST}
      - USER_SERVICE_DB_PORT=5432
      - USER_SERVICE_DB_NAME=${USER_SERVICE_DB_NAME}
      - USER_SERVICE_DB_USERNAME=${USER_SERVICE_DB_USERNAME}
      - USER_SERVICE_DB_PASSWORD=${USER_SERVICE_DB_PASSWORD}
      - KAFKA_HOST_PORT=${KAFKA_HOST_PORT}
      - CARD_SECRET_KEY=${CARD_SECRET_KEY}
      - REDIS_SECRET_PASSWORD=${REDIS_SECRET_PASSWORD}
      - ADMIN_INIT_SECRET=${ADMIN_INIT_SECRET}
    depends_on:
      user-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy


  core-auth-service:
