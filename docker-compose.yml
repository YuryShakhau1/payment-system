      - PAYMENT_SERVICE_MONGO_DB_USERNAME=${PAYMENT_SERVICE_MONGO_DB_USERNAME}
      - PAYMENT_SERVICE_MONGO_DB_PASSWORD=${PAYMENT_SERVICE_MONGO_DB_PASSWORD}
